{% block content %}<div class="auth-wrap login-wrap"><div class="auth-aside"><span class="eyebrow">WELCOME BACK</span><h1>Your learning journey is waiting.</h1><p>Pick up where you left off and discover your next learning opportunity.</p></div><form class="form-card" method="post"><span class="eyebrow">LEARNSMART ACCOUNT</span><h2>Log in</h2><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="button primary full" type="submit">Log in →</button><p class="form-foot">New to LearnSmart? <a href="{{ url_for('register') }}">Create an account</a></p></form></div>{% endblock %}
